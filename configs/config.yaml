seeds:
  - 0
  - 1
  - 2

datasets:
  - credit-g
  - credit-approval
  - diabetes
  - blood-transfusion-service-center
  - ilpd
  - wdbc
  - kc1
  - phoneme

openml_suite_id: 99
n_jobs: 6
test_size: 0.2
cv_folds: 5
llm:
  provider: ollama
  model: qwen2.5-coder:7b
